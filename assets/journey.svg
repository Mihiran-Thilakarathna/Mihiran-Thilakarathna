<style>
.m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.card{animation:in .8s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flash{opacity:0;transform-box:fill-box;transform-origin:center;animation:fl 10s ease-out infinite}
