.prog{transform-box:fill-box;transform-origin:left center;animation:pg 10s linear infinite}
@keyframes pg{0%{transform:scaleX(0)}92%,100%{transform:scaleX(1)}}
.goal{transform-box:fill-box;transform-origin:center;animation:gl 2s ease-in-out infinite}
@keyframes gl{50%{transform:scale(1.5) rotate(45deg);opacity:.5}}
.dots{animation:dt 1.2s steps(4) infinite}@keyframes dt{0%{opacity:0}50%{opacity:1}}
