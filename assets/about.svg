<text x="56" y="160" font-size="34" font-weight="800" fill="url(#ng)">&amp; intelligent AI solutions.</text>
<text x="56" y="210" font-size="17" fill="#8b95a7">I'm an IT undergraduate at Rajarata University of Sri Lanka</text><text x="56" y="238" font-size="17" fill="#8b95a7">who turns complex problems into scalable, user-centric</text><text x="56" y="266" font-size="17" fill="#8b95a7">digital products — from computer vision models to</text><text x="56" y="294" font-size="17" fill="#8b95a7">full-stack platforms, always with clean code in mind.</text>
<text x="56" y="338" font-size="12" fill="#8b95a7" letter-spacing="2" class="m">WHAT I DO</text>
