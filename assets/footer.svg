<style>
.m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.st{animation:st 1.4s linear infinite}
@keyframes st{from{transform:translateY(-20px)}to{transform:translateY(440px)}}
.rocket{animation:rk 2.6s ease-in-out infinite}
@keyframes rk{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-8px) rotate(1deg)}75%{transform:translate(-2px,6px) rotate(-1deg)}}
.flame{transform-box:fill-box;transform-origin:top center;animation:fl .15s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
.pf{opacity:0;animation:pf 1.4s ease-out infinite}
@keyframes pf{0%{opacity:.5;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),90px) scale(1.6)}}

</style>
