<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif">
<style>.m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}.sq{transform-box:fill-box;transform-origin:center;animation:sq 3s ease-in-out infinite}
@keyframes sq{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg);fill:#7cc0ff}}
.beam{animation:beam 3.5s ease-in-out infinite}
@keyframes beam{to{transform:translateX(919px)}}</style>
<defs>
<linearGradient id="hb" x1="0" x2="1"><stop offset="0" stop-color="#0b0f18"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#F7941D" stop-opacity="0"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#7cc0ff" stop-opacity="0"/></linearGradient>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="384" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#F7941D"/><stop offset=".5" stop-color="#ffd29a"/><stop offset="1" stop-color="#7cc0ff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;102 0;0 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="ln"><rect x="306" y="38" width="699" height="6"/></clipPath></defs>
<rect x="1" y="6" width="1198" height="72" rx="16" fill="url(#hb)" stroke="#1f2a44" stroke-width="1.5"/>
<rect x="30" y="34" width="14" height="14" rx="3" fill="#F7941D" class="sq"/>
<text x="56" y="47" font-size="16" fill="#F7941D" class="m">05</text>
<text x="112" y="53" font-size="31" font-weight="800" fill="url(#tg)">GitHub Pet</text>
<line x1="306" y1="41" x2="1005" y2="41" stroke="#1f2a44" stroke-width="2"/>
<g clip-path="url(#ln)"><rect class="beam" x="86" y="39" width="220" height="4" rx="2" fill="url(#beam)"/></g>
<text x="1168" y="47" font-size="14" fill="#8b95a7" text-anchor="end" class="m">fed by my commits</text>

</svg>
